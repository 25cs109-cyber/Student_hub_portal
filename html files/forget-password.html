<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Hub Portal | Forgot Password</title>
    <link rel="Stylesheet" href="../css files/forget-password.css">
   


</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1 class="logo">Student Hub Portal</h1>
            <p class="tagline">Connect. Learn. Grow.</p>
        </div>
    </header>
<!-- Light/Dark Mode Toggle Button -->


    <nav class="main-nav">
        <div class="container">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="features.html">Features</a></li>
                <li><a href="announcement.html">Announcements</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section class="login-section">
            <h2>Forgot Password</h2>
            <p class="subtitle">Enter your registered email to reset your password</p>

            <form action="login.html" method="get">
                <label for="reset-email">Registered Email:</label>
                <input type="email" id="reset-email" name="email" placeholder="you@college.edu">

                <label for="reset-roll">Roll Number:</label>
                <input type="text" id="reset-roll" name="rollno" placeholder="e.g. CS2024001">

                <div class="form-buttons">
                    <button type="submit">Send Reset Link</button>
                </div>
            </form>

            <div class="login-links">
                <a href="login.html">Back to Login</a>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Student Hub Portal. Web Development Practical 1 &amp; 2.</p>
            <p>Contact: <a href="contact.html">Contact Us</a></p>
        </div>
    </footer>
</body>
</html>
