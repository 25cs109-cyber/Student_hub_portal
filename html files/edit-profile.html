        <div class="dashboard-main">
            <p class="breadcrumb"><a href="dashboard.html">Dashboard</a> &gt; <a href="profile.html">Profile</a> &gt; Edit Profile</p>

            <section class="form-section">
                <h2>Edit Profile</h2>
                <form action="profile.html" method="get">
                    <label for="edit-name">Full Name:</label>
                    <input type="text" id="edit-name" name="name" value="Your Name">

                    <label for="edit-email">Email:</label>
                    <input type="email" id="edit-email" name="email" value="you@college.edu">

                    <label for="edit-mobile">Mobile:</label>
                    <input type="tel" id="edit-mobile" name="mobile" value="9876543210">

                    <label for="edit-address">Address:</label>
                    <textarea id="edit-address" name="address" rows="3">123 College Road, City</textarea>

                    <div class="form-buttons">
                        <button type="submit">Save Changes</button>
                        <a href="profile.html" class="cancel-btn">Cancel</a>
                    </div>
                </form>
            </section>
