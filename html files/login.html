<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Hub Portal | Login</title>
    <link rel="Stylesheet" href="../css files/login.css">
   


</head>
<body>

    


    <header class="site-header">
        <div class="container">
            <h1 class="logo">Student Hub Portal</h1>
            <p class="tagline">Connect. Learn. Grow.</p>
        </div>
    </header>

    <nav class="main-nav">
        <div class="container">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="features.html">Features</a></li>
                <li><a href="announcement.html">Announcements</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html" class="active">Login</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section class="login-section">
            <h2>Student Login</h2>
            <p class="subtitle">Enter your credentials to access the dashboard</p>

            <form action="dashboard.html" method="get">
                <label for="login-email">Email / Roll Number:</label>
                <input type="text" id="login-email" name="email" placeholder="CS2024001 or you@college.edu">
               <br>
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" name="password" placeholder="Enter password">
<br>
<br>
                <div class="form-buttons">
                    <button type="submit">Login</button>
                </div>
            </form>

            <div class="login-links">
                <a href="forgot-password.html">Forgot Password?</a>
                <a href="index.html">Back to Home</a>
            </div>
        </section>
        <!-- Light/Dark Mode Toggle Button -->


    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Student Hub Portal. Web Development Practical 1 &amp; 2.</p>
            <p>Contact: <a href="contact.html">Contact Us</a></p>
        </div>
    </footer>
    <script src="../js files/login.js"></script>
</body>
</html>
